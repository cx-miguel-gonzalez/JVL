jobs:
  cx-scan:
    executor: cxflow/default
    steps:
      - checkout
      - cxflow/scan:
          scanners: 'sast'
          team: \CxServer
          version: '9.0'
orbs:
  cxflow: checkmarx-ts/cxflow@1.0.4
version: 2.1
workflows:
  sast-scan:
    jobs:
      - cx-scan:
          filters:
            branches:
              only: master
  version: 2
