# This is a basic workflow to help you get started with Using Checkmarx CxFlow Action-1

name: CxOne

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches:
      - main
      - master
# A workflow run is made up of one or more jobs that can run sequentially or in parallel - this job is specifically configured to use the Checkmarx CxFlow Action
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on - Ubuntu is required as Docker is leveraged for the action
    runs-on: ubuntu-latest

    # Steps require - checkout code, run CxFlow Action, Upload SARIF report (optional)
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v2
    # Runs the Checkmarx Scan leveraging the latest version of CxFlow - REFER to Action README for list of inputs
    - name: Checkmarx AST Github Action
  # You may pin to the exact commit or the version.
  # uses: Checkmarx/ast-github-action@f9e0e85a6c0a37f3e716007203c9db7fe17356d4
      uses: Checkmarx/ast-github-action@2.0.20
      with:
        # Provide the AST portal URL
        base_uri: https://ast.checkmarx.net
        # Provide the Tenant for AST portal URL
        cx_tenant: ps_na_miguel_gonzalez
        # Client ID for AST portal authentication
        cx_client_id: ${{ secrets.CX_CLIENT_ID }}
        # Secret key for AST portal authentication
        cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
        # Additional parameters for AST scan
        additional_params: --scan-types sast,sca,IaC # optional, default is 
